# Configuração do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do Spring JPA para gerar o esquema automaticamente
spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true 
spring.jpa.open-in-view=false

# Cache
spring.cache.type=simple  
spring.cache.cache-names=weatherCache  

# Configuração de Logs (logback)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Configuração de Portas do Servidor
server.port=8080

# Configuração de Previsão do Tempo (API externa)
weather.api.url=https://api.open-meteo.com/v1/forecast
weather.api.key=YOUR_API_KEY  
# Configuração de Cache para Previsões (TTL de 1 hora)
spring.cache.weather-forecast.ttl=3600

# Configuração de Thymeleaf
spring.thymeleaf.cache=false  
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Configuração de CORS (se necessário para o frontend)
# Permite acesso de qualquer origem (ajustar conforme necessidade)
spring.webflux.cors.allowCredentials=true
spring.webflux.cors.allowedOrigins=http://localhost:3000

