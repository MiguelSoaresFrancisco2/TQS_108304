<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Refeições</title>
</head>
<body>
    <h1>Refeições Disponíveis</h1>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Data</th>
            <th>Previsão</th>
            <th>Reservar</th>
        </tr>
        <tr th:each="meal : ${meals}">
            <td th:text="${meal.name}"></td>
            <td th:text="${meal.date}"></td>
            <td th:text="${weatherService.getWeatherForDate(meal.date)}"></td>
            <td>
                <form action="/reserve" method="post">
                    <input type="hidden" name="mealId" th:value="${meal.id}" />
                    <button type="submit">Reservar</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
